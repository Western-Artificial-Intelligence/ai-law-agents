# Nibi US robustness subset config
# Model: Qwen2.5-72B-Instruct

cases:
  - template: bailiff/datasets/cases_us_subset/traffic.yaml
    cue: name_ethnicity
    placebos: [name_placebo]
    judge_blinding: false
  - template: bailiff/datasets/cases_us_subset/simple_assault.yaml
    cue: name_ethnicity
    placebos: [name_placebo]
  - template: bailiff/datasets/cases_us_subset/dui.yaml
    cue: name_chinese
    placebos: [name_placebo]

models:
  - backend: local
    model: Qwen/Qwen2.5-72B-Instruct
    params:
      provider: transformers
      model_name: Qwen/Qwen2.5-72B-Instruct
      device: cuda
      load_in_4bit: true
      temperature: 0.2
    backend_policy:
      timeout_seconds: 2400
      max_retries: 2
      backoff_seconds: 2.0
      backoff_multiplier: 2.0
      rate_limit_seconds: 0.0

seeds: [201, 202, 203, 204, 205, 206]

agent_budgets:
  judge:
    max_bytes: 2000
    max_tokens: 800
  prosecution:
    max_bytes: 2000
    max_tokens: 800
  defense:
    max_bytes: 2000
    max_tokens: 800

phase_budgets:
  - phase: opening
    max_messages: 2
  - phase: direct
    max_messages: 2
  - phase: cross
    max_messages: 2
  - phase: redirect
    max_messages: 1
  - phase: closing
    max_messages: 2
  - phase: verdict
    max_messages: 1
  - phase: audit
    max_messages: 1

concurrency: 1
max_retries: 2
backoff_seconds: 2.0
out_logs: runs/nibi_local_qwen25_72b_us_subset_logs.jsonl
manifest: runs/nibi_local_qwen25_72b_us_subset_manifest.jsonl

