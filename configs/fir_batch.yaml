# FIR/Compute-Alliance-ready batch configuration.
# Primary paper run: 6 cases x 30 seeds x 1 cue per case (+ placebo pairs).
# Total paired assignments with this config:
#   6 cases * 30 seeds * (1 primary cue + 1 placebo) = 360 paired runs.

cases:
  - template: bailiff/datasets/cases_canada/traffic.yaml
    cue: name_ethnicity
    placebos: [name_placebo]
    judge_blinding: false
  - template: bailiff/datasets/cases_canada/simple_assault.yaml
    cue: name_ethnicity
    placebos: [name_placebo]
  - template: bailiff/datasets/cases_canada/shoplifting.yaml
    cue: name_chinese
    placebos: [name_placebo]
  - template: bailiff/datasets/cases_canada/dui.yaml
    cue: name_chinese
    placebos: [name_placebo]
  - template: bailiff/datasets/cases_canada/vandalism.yaml
    cue: name_indian
    placebos: [name_placebo]
  - template: bailiff/datasets/cases_canada/petty_theft.yaml
    cue: name_indian
    placebos: [name_placebo]

models:
  # Local GPU model (recommended on FIR when you have GPU allocation)
  - backend: local
    model: meta-llama/Meta-Llama-3-8B-Instruct
    params:
      provider: transformers
      model_name: meta-llama/Meta-Llama-3-8B-Instruct
      device: cuda
      load_in_4bit: true
      temperature: 0.2
    backend_policy:
      timeout_seconds: 600
      max_retries: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      rate_limit_seconds: 0.0

  # Optional API model for faster iteration
  # - backend: groq
  #   model: llama3-8b-8192
  #   backend_policy:
  #     timeout_seconds: 90
  #     max_retries: 5
  #     backoff_seconds: 2.0
  #     backoff_multiplier: 2.0
  #     rate_limit_seconds: 1.0

seeds:
  [
    101, 102, 103, 104, 105, 106, 107, 108, 109, 110,
    111, 112, 113, 114, 115, 116, 117, 118, 119, 120,
    121, 122, 123, 124, 125, 126, 127, 128, 129, 130
  ]

agent_budgets:
  judge:
    max_bytes: 2000
    max_tokens: 800
  prosecution:
    max_bytes: 2000
    max_tokens: 800
  defense:
    max_bytes: 2000
    max_tokens: 800

phase_budgets:
  - phase: opening
    max_messages: 2
  - phase: direct
    max_messages: 2
  - phase: cross
    max_messages: 2
  - phase: redirect
    max_messages: 1
  - phase: closing
    max_messages: 2
  - phase: verdict
    max_messages: 1
  - phase: audit
    max_messages: 1

concurrency: 1
max_retries: 3
backoff_seconds: 2.0
out_logs: runs/fir_batch_logs.jsonl
manifest: runs/fir_batch_manifest.jsonl
