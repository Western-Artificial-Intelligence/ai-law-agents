  - census_surname_black_white
  - census_surname_hispanic_white
  - census_surname_asian_white
  placebos:
  - placebo_firstname_white
  - placebo_surname_white
  judge_blinding: false
models:
- backend: local
  model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  params:
    provider: transformers
    model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    device: cuda
    load_in_4bit: true
    temperature: 0.2
  backend_policy:
    timeout_seconds: 1800
    max_retries: 2
    backoff_seconds: 2.0
    backoff_multiplier: 2.0
    rate_limit_seconds: 0.0
seeds:
- 101
- 102
- 103
agent_budgets:
  judge:
    max_bytes: 2000
    max_tokens: 800
  prosecution:
    max_bytes: 2000
    max_tokens: 800
  defense:
    max_bytes: 2000
    max_tokens: 800
phase_budgets:
- phase: opening
  max_messages: 2
- phase: direct
  max_messages: 2
- phase: cross
  max_messages: 2
- phase: redirect
  max_messages: 1
- phase: closing
  max_messages: 2
- phase: verdict
  max_messages: 1
- phase: audit
  max_messages: 1
concurrency: 1
max_retries: 2
backoff_seconds: 2.0
out_logs: runs/nibi_local_deepseek_r1_distill_qwen32b_research_logs.jsonl
manifest: runs/nibi_local_deepseek_r1_distill_qwen32b_research_manifest.jsonl
