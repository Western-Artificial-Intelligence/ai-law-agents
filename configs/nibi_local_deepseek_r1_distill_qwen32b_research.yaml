# Research-backed cue matrix config (B&M + Census surname probabilities)
cases:
- template: bailiff/datasets/cases_canada/traffic.yaml
  cues:
  - bm_black_white_male
  - bm_black_white_female
  - census_surname_black_white
  - census_surname_hispanic_white
  - census_surname_asian_white
  placebos:
  - placebo_firstname_white
  - placebo_surname_white
  judge_blinding: false
- template: bailiff/datasets/cases_canada/simple_assault.yaml
  cues:
  - bm_black_white_male
  - bm_black_white_female
  - census_surname_black_white
  - census_surname_hispanic_white
  - census_surname_asian_white
  placebos:
  - placebo_firstname_white
  - placebo_surname_white
  judge_blinding: false
